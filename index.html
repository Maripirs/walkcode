<body><main><div class="tag">NEETCODE 150 · DOG-WALK DRILLS</div><h1>Read the code.<br><em>Make the move.</em></h1><p class="meta">A small coding decision first. The explanation comes after your answer.</p><div id="app">Loading your deck…</div><footer>Progress stays on this device.</footer></main><script>

let topics={},cards=[];
async function boot(){try{const text=await fetch('app/page.tsx').then(r=>r.text());const match=text.match(/const extraProblems:[\s\S]*?= (\{[\s\S]*?\n\});/);topics=Function('return '+match[1])();cards=[...featured,...Object.entries(topics).flatMap(([topic,names])=>names.map(title=>({topic,title,question:`Before coding ${title}, which pattern should you review first?`,code:`function solve(input) {\n  // ${title}\n  // establish the key invariant\n}`,choices:[topic,'Hash map','Two pointers','Dynamic programming','BFS / DFS'].filter((x,n,a)=>a.indexOf(x)===n).slice(0,4),correct:topic,explain:`This problem belongs to the ${topic} set. Use its walkthrough and a small hand-worked example before writing the solution.`})))]}catch{cards=featured}let index=+localStorage.walkcodeIndex||0,choice='';function render(){const c=cards[index%cards.length],answered=choice!=='';document.querySelector('#app').innerHTML=`<article class="card"><div class="tag">${c.topic.toUpperCase()} · ${index+1}/${cards.length}</div><h2>${c.title}</h2><p class="meta"><b>Your task:</b> ${c.question}</p><pre>${c.code}</pre><div class="options">${c.choices.map(x=>`<button data-answer="${x}" class="${choice===x?'selected':''}">${x}</button>`).join('')}</div>${answered?`<div class="answer ${choice===c.correct?'':'bad'}"><b>${choice===c.correct?'Nice — that’s it.':'Not quite.'}</b><br>${c.explain}</div>`:''}</article><button class="next">Next drill →</button><div class="roadmap">${Object.entries(topics).map(([k,v])=>`<button data-topic="${k}">${k}<b>${v.length}</b></button>`).join('')}</div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{choice=b.dataset.answer;render()});document.querySelector('.next').onclick=()=>{index++;choice='';localStorage.walkcodeIndex=index;render()};document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{const n=cards.findIndex(x=>x.topic===b.dataset.topic);if(n>=0){index=n;choice='';render();scrollTo(0,0)}})}render()}boot();
