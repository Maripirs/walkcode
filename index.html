<script>
const featured={
 'Two Sum':{brief:'Given an array of integers and a target, return the indices of two different numbers whose values add up to that target.',concepts:['Complement lookup','Hash map: value → index'],algorithm:['Walk through the array once.','For the current value n, calculate target − n.','If that complement is already saved, return its saved index and the current index.','Otherwise save n and its index for a future match.'],code:'const seen = new Map();\nfor (let i = 0; i < nums.length; i++) {\n  const need = target - nums[i];\n  if (seen.has(need)) return [seen.get(need), i];\n  seen.set(nums[i], i);\n}',fixes:['Save after checking, so you cannot use the same element twice.','Map values to indices—not booleans—because the result needs positions.'],complexity:'Time O(n); space O(n) for the map.'},
 'Two Sum II':{brief:'Given a sorted array and a target, return the two positions whose values add up to the target.',concepts:['Sorted order','Two pointers'],algorithm:['Start left at the first value and right at the last.','Compare their sum with target.','Too small: move left rightward. Too large: move right leftward.','A match is the answer.'],code:'let left = 0, right = numbers.length - 1;\nwhile (left < right) {\n  const sum = numbers[left] + numbers[right];\n  if (sum === target) return [left + 1, right + 1];\n  if (sum < target) left++; else right--;\n}',fixes:['Move only one pointer per comparison.','The input is already sorted; do not sort it again.'],complexity:'Time O(n); space O(1).'},
 'Longest Substring Without Repeating Characters':{brief:'Given a string, find the length of its longest contiguous substring with no repeated characters.',concepts:['Sliding window','Set of characters inside the current window'],algorithm:['Expand the right edge one character at a time.','If the new character already exists, shrink the left edge until it does not.','After the window is valid, update the best length.'],code:'const seen = new Set();\nlet left = 0, best = 0;\nfor (let right = 0; right < s.length; right++) {\n  while (seen.has(s[right])) seen.delete(s[left++]);\n  seen.add(s[right]);\n  best = Math.max(best, right - left + 1);\n}',fixes:['Delete s[left], not the incoming duplicate.','Measure after the window is repaired.'],complexity:'Time O(n); space O(min(n, alphabet size)).'},
 'Binary Search':{brief:'Given a sorted list and a target, return its index or -1 without checking every value.',concepts:['Sorted order','Binary search interval'],algorithm:['Keep a left and right boundary for the possible answer.','Check the middle value.','Discard the half that cannot contain target.','Stop when the boundaries cross.'],code:'let left = 0, right = nums.length - 1;\nwhile (left <= right) {\n  const mid = Math.floor((left + right) / 2);\n  if (nums[mid] === target) return mid;\n  if (nums[mid] < target) left = mid + 1;\n  else right = mid - 1;\n}\nreturn -1;',fixes:['Use left <= right so a single remaining value is checked.','Move past mid; mid was already tested.'],complexity:'Time O(log n); space O(1).'},
 'Valid Parentheses':{brief:'Given brackets, decide whether every opening bracket is closed in the correct order.',concepts:['Last-in, first-out order','Stack'],algorithm:['Push every opening bracket.','For a closing bracket, the stack must have the matching opener on top.','Pop that opener; the stack must be empty at the end.'],code:'const pairs = { ")":"(", "]":"[", "}":"{" };\nconst stack = [];\nfor (const ch of s) {\n  if (ch in pairs) { if (stack.pop() !== pairs[ch]) return false; }\n  else stack.push(ch);\n}\nreturn stack.length === 0;',fixes:['Check the result of pop; an empty stack is invalid.','Do not only compare counts—order matters.'],complexity:'Time O(n); space O(n).'},
 'Number of Islands':{brief:'Given a grid of land and water, count the distinct groups of connected land.',concepts:['Grid graph','DFS or BFS','Visited set / in-place marking'],algorithm:['Scan every cell.','When you find unvisited land, increment the count.','Flood-fill all connected land so it is not counted again.'],code:'function visit(r, c) {\n  if (r < 0 || c < 0 || r === rows || c === cols || grid[r][c] !== "1") return;\n  grid[r][c] = "0";\n  visit(r+1,c); visit(r-1,c); visit(r,c+1); visit(r,c-1);\n}',fixes:['Mark a cell visited when it is discovered, not later.','Check grid boundaries before indexing.'],complexity:'Time O(rows × cols); space O(rows × cols) in the worst case.'}
};

 'Two Pointers':{concepts:['Sorted order or opposing boundaries','Two moving indices'],algorithm:['Define what each pointer represents.','Use a comparison to prove which pointer can move.','Stop when pointers cross.'],fixes:['Move the pointer that can improve the result.','Handle equal values deliberately.'],complexity:'Usually O(n) time and O(1) space.'},

 '1-D Dynamic Programming':{concepts:['State for a prefix or index','Overlapping subproblems'],algorithm:['Define dp[i] in words.','Write its recurrence.','Set base cases and iterate in dependency order.'],fixes:['Do not use a state before it exists.','Consider constant-space compression.'],complexity:'Usually O(n) time and O(n) or O(1) space.'},

};
