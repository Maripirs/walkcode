<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>walkcode</title><style>body{margin:0;background:#fbfaf6;color:#1b2533;font:16px Arial,sans-serif}main{max-width:560px;margin:auto;padding:22px}h1{font-size:44px;margin:30px 0 8px;letter-spacing:-2px}em{font-family:Georgia;color:#df6b57}.tag{color:#137a78;font-size:12px;font-weight:bold;letter-spacing:1px}.card{background:white;border:1px solid #e5e2d9;border-radius:18px;padding:20px;margin-top:24px;box-shadow:0 8px 24px #2332}.options button,.next{width:100%;text-align:left;margin:7px 0;padding:13px;border:1px solid #d5dad4;border-radius:10px;background:white;font:inherit}.options button.selected{background:#eaf5f3;border-color:#137a78}.next{background:#137a78;color:white;border:0;text-align:center;font-weight:bold}.meta{color:#68716f;font-size:14px}.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:20px}.roadmap button{padding:10px;border:0;border-radius:9px;background:#f0efe8;text-align:left}.roadmap button b{display:block;color:#137a78}.answer{margin-top:12px;padding:12px;background:#eaf5f3;border-radius:10px;line-height:1.4}footer{margin:24px 0;color:#68716f;font-size:12px}</style><main><div class="tag">NEETCODE 150 · DOG-WALK DRILLS</div><h1>Read the code.<br><em>Make the move.</em></h1><p class="meta">Tiny pattern reps for the full NeetCode 150—built to fit a walk.</p><div id="app">Loading your deck…</div><footer>Progress stays on this device.</footer></main><script>const special=['Two Sum','Two Sum II - Input Array Is Sorted','Longest Substring Without Repeating Characters','Binary Search','Valid Parentheses','Number of Islands'];let topics={},cards=[];async function boot(){try{let t=await fetch('app/page.tsx').then(r=>r.text()),m=t.match(/const extraProblems:[\s\S]*?= (\{[\s\S]*?\n\});/);topics=Function('return '+m[1])();cards=[...special.map(x=>['Quick drill',x]),...Object.entries(topics).flatMap(([k,v])=>v.map(x=>[k,x]))]}catch(e){cards=special.map(x=>['Quick drill',x])}let i=+localStorage.walkcodeIndex||0,chosen='';function render(){let [topic,title]=cards[i%cards.length];document.querySelector('#app').innerHTML=`<div class="card"><div class="tag">${topic.toUpperCase()} · ${i+1}/${cards.length}</div><h2>${title}</h2><p class="meta">Choose the core pattern you would reach for first.</p><pre>function solve(input) {\n  // ${title}\n  // choose an invariant\n}</pre><div class="options">${[topic,'Hash map','Two pointers','Dynamic programming','BFS / DFS'].filter((x,n,a)=>a.indexOf(x)===n).slice(0,4).map(x=>`<button data-x="${x}" class="${chosen===x?'selected':''}">${x}</button>`).join('')}</div>${chosen?`<div class="answer">${chosen===topic?'✓ Good instinct. This belongs to the '+topic+' pattern set.':'Try again—this problem is categorized under '+topic+'.'} Open the full problem when you have desk time, then return for a quick review.</div>`:''}</div><button class="next">Next drill →</button><div class="roadmap">${Object.entries(topics).map(([k,v])=>`<button data-topic="${k}">${k}<b>${v.length}</b></button>`).join('')}</div>`;document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{chosen=b.dataset.x;render()});document.querySelector('.next').onclick=()=>{i++;chosen='';localStorage.walkcodeIndex=i;render()};document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{let n=cards.findIndex(x=>x[0]===b.dataset.topic);if(n>=0){i=n;chosen='';render();scrollTo(0,0)}})}render()}boot();</script></html>
